<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descubre arquitectos, proyectos y terrenos en ArquiHub.">
    <title>ArquiHub | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/desktop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
</head>
<body>
    <div class="app-frame">
        <header class="home-header">
            <button class="menu-toggle home-menu-toggle" type="button" data-sidebar-toggle aria-controls="arqhub-sidebar" aria-expanded="false" aria-label="Abrir menú">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <a class="home-brand" href="home.html" aria-label="ArquiHub, inicio">
                <span class="home-brand-mark" aria-hidden="true"><i class="fa-solid fa-a"></i></span>
                <span>ARQUIHUB</span>
            </a>
            <button class="header-action" type="button" aria-label="Ver notificaciones">
                <i class="fa-regular fa-bell" aria-hidden="true"></i>
            </button>
        </header>

        <main class="home-main">
            <section class="search-section" aria-labelledby="search-title">
                <div class="section-kicker" id="search-title">Descubre tu próximo proyecto</div>
                <form class="search-form" role="search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input id="home-search" type="search" placeholder="Buscar terrenos, arquitectos..." autocomplete="off">
                    <button type="submit" aria-label="Buscar"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                </form>
                <div class="filter-row" aria-label="Filtros rápidos">
                    <button class="filter-chip is-selected" type="button" data-filter="all">Todo</button>
                    <button class="filter-chip" type="button" data-filter="favorites"><i class="fa-regular fa-star" aria-hidden="true"></i> Favorites</button>
                    <button class="filter-chip" type="button" data-filter="history"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> History</button>
                    <button class="filter-chip" type="button" data-filter="following"><i class="fa-solid fa-user-plus" aria-hidden="true"></i> Following</button>
                </div>
            </section>

            <section class="feature-card" aria-labelledby="feature-title">
                <div class="feature-copy">
                    <span class="eyebrow">Tu espacio creativo</span>
                    <h1 id="feature-title">ARQUIHUB</h1>
                    <p>Conecta ideas, personas y lugares para construir lo que sigue.</p>
                    <a class="feature-link" href="explorar-proyectos.html">Explorar proyectos <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
                </div>
                <div class="feature-shape" aria-hidden="true"><span></span></div>
            </section>

            <section class="content-section" aria-labelledby="architects-title">
                <div class="section-heading">
                    <div>
                        <span class="section-label">La red ArquiHub</span>
                        <h2 id="architects-title">Arquitectos</h2>
                    </div>
                    <a href="arquitecto.html?id=1" class="see-all">Ver todos <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
                </div>
                <div class="architect-list" id="architect-list"></div>
            </section>

            <section class="content-section projects-section" aria-labelledby="projects-title">
                <div class="section-heading">
                    <div>
                        <span class="section-label">Oportunidades cerca de ti</span>
                        <h2 id="projects-title">Proyectos y terrenos</h2>
                    </div>
                    <a href="explorar-proyectos.html" class="see-all">Ver todos <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
                </div>
                <div class="project-list" id="project-list"></div>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Navegación principal">
            <a class="bottom-nav-link is-active" href="home.html" aria-current="page"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span></a>
            <a class="bottom-nav-link" href="buscador.html"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>Explorar</span></a>
            <a class="bottom-nav-link bottom-nav-publish" href="publicar.html" aria-label="Publicar"><i class="fa-solid fa-plus" aria-hidden="true"></i></a>
            <a class="bottom-nav-link" href="notificaciones.html"><i class="fa-regular fa-bell" aria-hidden="true"></i><span>Notificaciones</span></a>
            <a class="bottom-nav-link" href="perfil.html"><i class="fa-regular fa-user" aria-hidden="true"></i><span>Perfil</span></a>
        </nav>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/home.js"></script>
</body>
</html>
