<html lang="es">

    <title>ArquiHub | Publicá</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/publicar.css">
    <link rel="stylesheet" href="../css/desktop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">

<body>
    <div class="app-frame publish-frame">
        <header class="publish-header">
            <button class="menu-toggle publish-menu-toggle" type="button" data-sidebar-toggle aria-controls="arqhub-sidebar" aria-expanded="false" aria-label="Abrir menú">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <a class="publish-brand" href="home.html" aria-label="ArquiHub, inicio">
                <span class="publish-brand-mark" aria-hidden="true"><i class="fa-solid fa-a"></i></span>
                <span>ARQUIHUB</span>
            </a>
            <a class="profile-dot" href="perfil.html" aria-label="Abrir perfil"><i class="fa-regular fa-user" aria-hidden="true"></i></a>

            <section class="publish-content" aria-labelledby="publish-title">

                <span class="section-label">Comparte en ArquiHub</span>

                <p class="publish-lead">Compartí tu terreno o creá una propuesta arquitectónica.</p>

                <a class="publish-cta" href="elegir-publicacion.html">Publicá <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Navegación principal">
            <a class="bottom-nav-link" href="home.html"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span></a>

            <a class="bottom-nav-link" href="notificaciones.html"><i class="fa-regular fa-bell" aria-hidden="true"></i><span>Notificaciones</span></a>
